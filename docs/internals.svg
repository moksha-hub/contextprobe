<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1700" width="1400" height="1700" font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Chalkboard SE',cursive">
  <defs>
    <pattern id="grid2" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#dcd5c4" stroke-width="0.6"/>
    </pattern>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#23201c"/>
    </marker>
    <marker id="a2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b03a2e"/>
    </marker>
  </defs>

  <rect width="1400" height="1700" fill="#fdfbf4"/>
  <rect width="1400" height="1700" fill="url(#grid2)"/>
  <path d="M96,0 L96,1700" stroke="#e2b4ae" stroke-width="1.6"/>

  <g transform="rotate(-0.4 700 70)">
    <rect x="150" y="34" width="1130" height="86" rx="8" fill="#fff" stroke="#23201c" stroke-width="3"/>
    <rect x="154" y="38" width="1130" height="86" rx="8" fill="none" stroke="#23201c" stroke-width="0.9" opacity="0.3"/>
  </g>
  <text x="182" y="76" font-size="32" font-weight="bold" fill="#23201c">CONTEXTPROBE &#8212; INTERNALS &amp; MEASUREMENT</text>
  <text x="182" y="106" font-size="18" fill="#5f5a52">data model, the 3-way decision, scoring, and worked numbers from the fixture</text>
  <text x="1130" y="106" font-size="15" fill="#b03a2e">sheet 2 of 3</text>

  <!-- ===== DATA MODEL ===== -->
  <text x="164" y="168" font-size="21" font-weight="bold" fill="#1f4e79">A &#183; DATA MODEL (SQLite, 5 tables)</text>

  <g transform="rotate(-0.4 300 250)">
    <rect x="164" y="184" width="272" height="132" rx="7" fill="#fff" stroke="#23201c" stroke-width="2.4"/>
  </g>
  <text x="180" y="208" font-size="15" font-weight="bold" fill="#23201c">assets</text>
  <text x="180" y="230" font-size="12" fill="#5f5a52">id PK &#183; name &#183; asset_type</text>
  <text x="180" y="249" font-size="12" fill="#5f5a52">description &#183; owner</text>
  <text x="180" y="268" font-size="12" fill="#b03a2e">certified &#8594; risk &#215;1.5</text>
  <text x="180" y="287" font-size="12" fill="#5f5a52">deprecated</text>
  <text x="180" y="308" font-size="11" fill="#2e6b4f">12 rows in fixture</text>

  <g transform="rotate(0.3 620 250)">
    <rect x="484" y="184" width="272" height="132" rx="7" fill="#fff" stroke="#23201c" stroke-width="2.4"/>
  </g>
  <text x="500" y="208" font-size="15" font-weight="bold" fill="#23201c">columns</text>
  <text x="500" y="230" font-size="12" fill="#5f5a52">(asset_id, name) PK</text>
  <text x="500" y="249" font-size="12" fill="#5f5a52">data_type</text>
  <text x="500" y="268" font-size="12" fill="#2e6b4f">description &#8592; THE THING</text>
  <text x="500" y="287" font-size="12" fill="#2e6b4f">UNDER TEST (editable)</text>
  <text x="500" y="308" font-size="11" fill="#5f5a52">11 rows &#183; mixed quality</text>

  <g transform="rotate(-0.2 940 250)">
    <rect x="804" y="184" width="272" height="132" rx="7" fill="#fff" stroke="#23201c" stroke-width="2.4"/>
  </g>
  <text x="820" y="208" font-size="15" font-weight="bold" fill="#23201c">lineage_edges</text>
  <text x="820" y="230" font-size="12" fill="#5f5a52">(upstream_id,</text>
  <text x="820" y="249" font-size="12" fill="#5f5a52">&#8194;downstream_id) PK</text>
  <text x="820" y="270" font-size="12" fill="#b03a2e">&#8594; BFS gives blast radius</text>
  <text x="820" y="291" font-size="11" fill="#5f5a52">9 edges, 4 levels deep</text>

  <g transform="rotate(0.4 1200 250)">
    <rect x="1096" y="184" width="184" height="132" rx="7" fill="#fdeceb" stroke="#b03a2e" stroke-width="2.4"/>
  </g>
  <text x="1112" y="208" font-size="15" font-weight="bold" fill="#b03a2e">probes</text>
  <text x="1112" y="230" font-size="11.5" fill="#5f5a52">question</text>
  <text x="1112" y="248" font-size="11.5" fill="#5f5a52">required_terms[]</text>
  <text x="1112" y="266" font-size="11.5" fill="#b03a2e">expected_answer</text>
  <text x="1112" y="284" font-size="11.5" fill="#b03a2e">wrong_answer</text>
  <text x="1112" y="302" font-size="11.5" fill="#b03a2e">correct_markers[]</text>

  <g transform="rotate(-0.25 720 372)">
    <rect x="164" y="336" width="1116" height="70" rx="7" fill="#fff" stroke="#23201c" stroke-width="2.4"/>
  </g>
  <text x="180" y="360" font-size="15" font-weight="bold" fill="#23201c">probe_results</text>
  <text x="180" y="382" font-size="12" fill="#5f5a52">probe_id &#183; asset_id &#183; engine &#183; outcome &#183; answer &#183; created_at</text>
  <text x="700" y="360" font-size="12.5" fill="#2e6b4f">context_seen &#8212; the EXACT description string the answerer received</text>
  <text x="700" y="382" font-size="12.5" fill="#2e6b4f">stored per result, so any finding stays auditable after the fact</text>

  <!-- ===== ANSWERER DECISION ===== -->
  <text x="164" y="460" font-size="21" font-weight="bold" fill="#1f4e79">B &#183; SIMULATED ANSWERER &#8212; ordered rules, first match wins</text>

  <g transform="rotate(0.2 300 512)">
    <rect x="180" y="484" width="240" height="56" rx="26" fill="#eef4fa" stroke="#1f4e79" stroke-width="2.2"/>
  </g>
  <text x="300" y="518" font-size="15" text-anchor="middle" fill="#23201c">all required facts</text>
  <text x="300" y="536" font-size="13" text-anchor="middle" fill="#5f5a52">present in description?</text>
  <path d="M420,512 L470,512" stroke="#2e6b4f" stroke-width="2.2" marker-end="url(#a2)"/>
  <text x="432" y="504" font-size="12" fill="#2e6b4f">YES</text>
  <g transform="rotate(-0.4 570 512)">
    <rect x="474" y="490" width="192" height="46" rx="7" fill="#eef7f1" stroke="#2e6b4f" stroke-width="2.2"/>
  </g>
  <text x="570" y="519" font-size="15" text-anchor="middle" fill="#2e6b4f">answer correctly</text>

  <path d="M300,540 L300,584" stroke="#b03a2e" stroke-width="2.2" marker-end="url(#a2r)"/>
  <text x="310" y="566" font-size="12" fill="#b03a2e">NO</text>

  <g transform="rotate(-0.2 300 610)">
    <rect x="180" y="584" width="240" height="52" rx="26" fill="#eef4fa" stroke="#1f4e79" stroke-width="2.2"/>
  </g>
  <text x="300" y="616" font-size="15" text-anchor="middle" fill="#23201c">description empty?</text>
  <path d="M420,610 L470,610" stroke="#7a5c00" stroke-width="2.2" marker-end="url(#a2)"/>
  <text x="432" y="602" font-size="12" fill="#7a5c00">YES</text>
  <g transform="rotate(0.3 570 610)">
    <rect x="474" y="588" width="192" height="46" rx="7" fill="#fff8e1" stroke="#c9a227" stroke-width="2.2"/>
  </g>
  <text x="570" y="617" font-size="15" text-anchor="middle" fill="#7a5c00">ABSTAIN &#8212; safe</text>

  <path d="M300,636 L300,680" stroke="#b03a2e" stroke-width="2.2" marker-end="url(#a2r)"/>
  <g transform="rotate(0.25 300 706)">
    <rect x="180" y="680" width="240" height="52" rx="26" fill="#eef4fa" stroke="#1f4e79" stroke-width="2.2"/>
  </g>
  <text x="300" y="704" font-size="14" text-anchor="middle" fill="#23201c">says "unverified" /</text>
  <text x="300" y="722" font-size="14" text-anchor="middle" fill="#23201c">"see owner" / "tbd"?</text>
  <path d="M420,706 L470,706" stroke="#7a5c00" stroke-width="2.2" marker-end="url(#a2)"/>
  <text x="432" y="698" font-size="12" fill="#7a5c00">YES</text>
  <g transform="rotate(-0.3 570 706)">
    <rect x="474" y="684" width="192" height="46" rx="7" fill="#fff8e1" stroke="#c9a227" stroke-width="2.2"/>
  </g>
  <text x="570" y="713" font-size="15" text-anchor="middle" fill="#7a5c00">ABSTAIN &#8212; safe</text>

  <path d="M300,732 L300,776" stroke="#b03a2e" stroke-width="2.2" marker-end="url(#a2r)"/>
  <g transform="rotate(-0.3 420 802)">
    <rect x="180" y="776" width="480" height="52" rx="7" fill="#fdeceb" stroke="#b03a2e" stroke-width="2.6"/>
  </g>
  <text x="420" y="800" font-size="15" text-anchor="middle" fill="#b03a2e">PRESENT BUT VAGUE &#8594; commits to a plausible wrong answer</text>
  <text x="420" y="820" font-size="12.5" text-anchor="middle" fill="#5f5a52">this is the hypothesis. Engine B exists to test it.</text>

  <g transform="rotate(0.3 990 660)">
    <rect x="716" y="484" width="564" height="352" rx="8" fill="#fff8e1" stroke="#c9a227" stroke-width="2.2"/>
  </g>
  <text x="736" y="514" font-size="18" font-weight="bold" fill="#7a5c00">THE FINDING THAT INVERTS INTUITION</text>
  <text x="736" y="548" font-size="14" fill="#23201c">dim_customer.region&#8194;&#8594;&#8194;"Region."</text>
  <text x="752" y="570" font-size="13" fill="#b03a2e">authoritative, terse, says nothing</text>
  <text x="752" y="590" font-size="13" fill="#b03a2e">agent: "It is the billing region."&#8194;WRONG</text>
  <text x="752" y="610" font-size="13" fill="#b03a2e">100% covered &#183; RISK 4.00 &#183; worst in catalog</text>
  <text x="736" y="648" font-size="14" fill="#23201c">legacy_customers.email&#8194;&#8594;&#8194;"...Unverified</text>
  <text x="736" y="668" font-size="14" fill="#23201c">legacy field, see owner before use."</text>
  <text x="752" y="690" font-size="13" fill="#2e6b4f">admits what it does not know</text>
  <text x="752" y="710" font-size="13" fill="#2e6b4f">agent: abstains</text>
  <text x="752" y="730" font-size="13" fill="#2e6b4f">100% covered &#183; RISK 0.00 &#183; safe</text>
  <rect x="736" y="748" width="524" height="72" rx="6" fill="#fff" stroke="#7a5c00" stroke-width="1.8"/>
  <text x="750" y="774" font-size="14.5" fill="#23201c">&#8594; metadata that admits its own gaps is SAFER for an</text>
  <text x="750" y="796" font-size="14.5" fill="#23201c">&#8194;&#8194;&#8194;agent than metadata that sounds sure and says nothing.</text>
  <text x="750" y="814" font-size="12.5" fill="#b03a2e">an authoring rule you cannot derive from a coverage metric.</text>

  <!-- ===== GRADING ===== -->
  <text x="164" y="890" font-size="21" font-weight="bold" fill="#1f4e79">C &#183; GRADING &#8212; three outcomes, only one is scored</text>

  <g transform="rotate(-0.3 380 966)">
    <rect x="164" y="906" width="432" height="120" rx="7" fill="#eef7f1" stroke="#2e6b4f" stroke-width="2.4"/>
  </g>
  <text x="182" y="934" font-size="17" font-weight="bold" fill="#2e6b4f">CORRECT</text>
  <text x="182" y="960" font-size="13" fill="#23201c">answered &amp; matched a ground-truth marker</text>
  <text x="182" y="984" font-size="13" fill="#5f5a52">the metadata did its job</text>
  <text x="182" y="1012" font-size="14" fill="#2e6b4f">risk contribution:&#8194;0</text>

  <g transform="rotate(0.25 830 966)">
    <rect x="614" y="906" width="432" height="120" rx="7" fill="#fff8e1" stroke="#c9a227" stroke-width="2.4"/>
  </g>
  <text x="632" y="934" font-size="17" font-weight="bold" fill="#7a5c00">ABSTAINED</text>
  <text x="632" y="960" font-size="13" fill="#23201c">declined to answer &#8212; a SAFE failure</text>
  <text x="632" y="984" font-size="13" fill="#5f5a52">human loses seconds, not trust</text>
  <text x="632" y="1012" font-size="14" fill="#7a5c00">risk contribution:&#8194;0&#8194;&#8194;&#8592; deliberate</text>

  <g transform="rotate(-0.2 1170 966)">
    <rect x="1064" y="906" width="216" height="120" rx="7" fill="#fdeceb" stroke="#b03a2e" stroke-width="3"/>
  </g>
  <text x="1082" y="934" font-size="17" font-weight="bold" fill="#b03a2e">CONFIDENT</text>
  <text x="1082" y="954" font-size="17" font-weight="bold" fill="#b03a2e">WRONG</text>
  <text x="1082" y="980" font-size="13" fill="#23201c">committed &amp; wrong</text>
  <text x="1082" y="1000" font-size="13" fill="#5f5a52">dashboard built on a lie</text>
  <text x="1082" y="1018" font-size="13.5" fill="#b03a2e">drives 100% of risk</text>

  <text x="164" y="1056" font-size="13.5" fill="#5f5a52">also tracked: over_abstention &#8212; declined even though the facts WERE present. a usability miss, not a safety one.</text>
  <text x="164" y="1078" font-size="13.5" fill="#b03a2e">binary pass/fail evaluation collapses the middle column into the right one. that is the distinction this whole project exists to keep.</text>

  <!-- ===== SCORING + WORKED NUMBERS ===== -->
  <text x="164" y="1136" font-size="21" font-weight="bold" fill="#1f4e79">D &#183; MEASURED OUTPUT (simulated engine, seeded fixture &#8212; py backend\measure.py)</text>

  <g transform="rotate(0.15 490 1290)">
    <rect x="164" y="1152" width="652" height="276" rx="8" fill="#fff" stroke="#23201c" stroke-width="2.4"/>
  </g>
  <text x="182" y="1180" font-size="15" font-weight="bold" fill="#23201c">asset&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;cov&#8194;&#8194;ok&#8194;&#8194;abst&#8194;wrong&#8194;down&#8194;&#8194;RISK</text>
  <path d="M180,1190 L800,1190" stroke="#23201c" stroke-width="1.4"/>
  <rect x="176" y="1198" width="628" height="26" fill="#fdeceb"/>
  <text x="182" y="1217" font-size="14" fill="#b03a2e">dim_customer&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;100%&#8194;&#8194;&#8194;0&#8194;&#8194;&#8194;&#8194;&#8194;0&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;1&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;3&#8194;&#8194;&#8194;4.00</text>
  <rect x="176" y="1226" width="628" height="26" fill="#fdeceb" opacity="0.6"/>
  <text x="182" y="1245" font-size="14" fill="#23201c">fct_revenue&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;75%&#8194;&#8194;&#8194;4&#8194;&#8194;&#8194;&#8194;&#8194;1&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;5&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;2&#8194;&#8194;&#8194;2.25</text>
  <rect x="176" y="1254" width="628" height="26" fill="#fdeceb" opacity="0.35"/>
  <text x="182" y="1273" font-size="14" fill="#23201c">stg_payments&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;100%&#8194;&#8194;&#8194;2&#8194;&#8194;&#8194;&#8194;&#8194;0&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;1&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;3&#8194;&#8194;&#8194;1.33</text>
  <text x="182" y="1301" font-size="14" fill="#2e6b4f">legacy_customers&#8194;&#8194;&#8194;&#8194;&#8194;100%&#8194;&#8194;&#8194;0&#8194;&#8194;&#8194;&#8194;&#8194;1&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;0&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;0&#8194;&#8194;&#8194;0.00</text>
  <text x="182" y="1329" font-size="14" fill="#2e6b4f">stg_customers&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;100%&#8194;&#8194;&#8194;1&#8194;&#8194;&#8194;&#8194;&#8194;0&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;0&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;4&#8194;&#8194;&#8194;0.00</text>
  <text x="182" y="1357" font-size="14" fill="#2e6b4f">stg_orders&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;100%&#8194;&#8194;&#8194;1&#8194;&#8194;&#8194;&#8194;&#8194;0&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;0&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;3&#8194;&#8194;&#8194;0.00</text>
  <text x="182" y="1385" font-size="14" fill="#2e6b4f">sandbox_experiments&#8194;&#8194;&#8194;&#8194;&#8194;0%&#8194;&#8194;&#8194;0&#8194;&#8194;&#8194;&#8194;&#8194;1&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;0&#8194;&#8194;&#8194;&#8194;&#8194;&#8194;0&#8194;&#8194;&#8194;0.00</text>
  <text x="182" y="1414" font-size="12.5" fill="#5f5a52">18 probes total &#8594; 8 correct &#183; 3 abstained &#183; 7 confident wrong</text>

  <g transform="rotate(-0.3 1050 1250)">
    <rect x="836" y="1152" width="444" height="196" rx="8" fill="#fff8e1" stroke="#c9a227" stroke-width="2.2"/>
  </g>
  <text x="856" y="1180" font-size="16" font-weight="bold" fill="#7a5c00">READ TOP AND BOTTOM TOGETHER</text>
  <text x="856" y="1208" font-size="13" fill="#b03a2e">dim_customer&#8194;&#8194;100% covered &#183; MOST dangerous</text>
  <text x="856" y="1232" font-size="13" fill="#2e6b4f">sandbox_experiments&#8194;0% covered &#183; zero risk</text>
  <text x="856" y="1264" font-size="13.5" fill="#23201c">a coverage dashboard rewards the first and</text>
  <text x="856" y="1284" font-size="13.5" fill="#23201c">flags the second. for agent safety that is</text>
  <text x="856" y="1304" font-size="13.5" fill="#23201c">exactly backwards.</text>
  <text x="856" y="1332" font-size="12.5" fill="#5f5a52">worked: 1/1 wrong &#215; (1+3 down) &#215; 1.0 = 4.00</text>

  <g transform="rotate(0.2 1050 1400)">
    <rect x="836" y="1360" width="444" height="126" rx="8" fill="#fff" stroke="#23201c" stroke-width="2.4"/>
  </g>
  <text x="856" y="1388" font-size="16" font-weight="bold" fill="#1f4e79">CONTROLLED PAIR (same asset)</text>
  <text x="856" y="1414" font-size="13.5" fill="#b03a2e">net_revenue&#8194;&#8194;&#8194;documented &#183; 0/4 ok &#183; 4/4 WRONG</text>
  <text x="856" y="1438" font-size="13.5" fill="#2e6b4f">gross_revenue&#8194;documented &#183; 4/4 ok &#183; 0/4 wrong</text>
  <text x="856" y="1466" font-size="12.5" fill="#5f5a52">same 4 facts probed. only description quality differs.</text>

  <!-- ===== HONESTY BOX ===== -->
  <g transform="rotate(-0.2 722 1580)">
    <rect x="164" y="1512" width="1116" height="148" rx="8" fill="#fdeceb" stroke="#b03a2e" stroke-width="2.6"/>
  </g>
  <text x="184" y="1542" font-size="18" font-weight="bold" fill="#b03a2e">TESTED AGAINST A REAL MODEL &#8212; AND FALSIFIED</text>
  <text x="184" y="1572" font-size="13.5" fill="#23201c">The simulated rule is "vague &#8594; confident guess". So 4/4 wrong on net_revenue restates the rule; it is not a discovery.</text>
  <text x="184" y="1596" font-size="13.5" fill="#b03a2e">Run against ling-3.0-tiny at temp 0: on ALL 7 probes where the rule predicted a guess, the model ABSTAINED instead.</text>
  <text x="184" y="1620" font-size="13.5" fill="#b03a2e">confident_wrong: simulated 7 &#8594; model 1 (of 26 evaluations). These risk scores OVERSTATE the danger.</text>
  <text x="184" y="1642" font-size="13.5" fill="#2e6b4f">Bonus finding: the one probe the model DID guess on had NO description at all &#8212; absent metadata looks more dangerous than vague.</text>
</svg>
