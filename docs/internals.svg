<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1300" width="1400" height="1300" role="img" aria-labelledby="title desc">
  <title id="title">Proof-carrying compiler internals</title>
  <desc id="desc">How exact source spans become four controlled metadata variants, fixed labels, deterministic validation, and model-only scores.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e8e3d8"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9Z" fill="#26352f"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#203129}.title{font-size:34px;font-weight:800}.sub{font-size:16px;fill:#63736b}.h{font-size:20px;font-weight:800}.k{font-size:13px;font-weight:800;letter-spacing:1px}.b{font-size:14px}.s{font-size:12px;fill:#63736b}.mono{font-family:Consolas,monospace;font-size:13px}.card{fill:#fff;stroke:#ced9d2;stroke-width:2}.det{fill:#eef7f1;stroke:#2e6b4f;stroke-width:2}.prob{fill:#fff1ef;stroke:#b64a3d;stroke-width:2}.warn{fill:#fff9e7;stroke:#b99424;stroke-width:2}.line{fill:none;stroke:#26352f;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="1300" fill="#fcfaf4"/><rect width="1400" height="1300" fill="url(#grid)"/>
  <rect x="70" y="38" width="1260" height="100" rx="14" class="card"/>
  <text x="105" y="82" class="title">PROOF-CARRYING MUTATION INTERNALS</text>
  <text x="105" y="113" class="sub">The transform supplies the expected relationship; the model supplies only the observed label</text>

  <text x="80" y="184" class="h">1 · SOURCE AND COMPILATION</text>
  <rect x="70" y="204" width="405" height="150" rx="12" class="card"/>
  <text x="92" y="235" class="k">SUBMITTED METADATA</text><text x="92" y="267" class="mono">payment_amount · decimal</text><text x="92" y="298" class="mono">"Payment amount in USD,</text><text x="92" y="320" class="mono"> excluding tax."</text><text x="92" y="342" class="s">Raw text is preserved byte-for-byte.</text>
  <path d="M475 279H510" class="line"/>
  <rect x="512" y="204" width="405" height="150" rx="12" class="det"/>
  <text x="534" y="235" class="k">CONTROLLED CLAUSE SCANNER</text><text x="534" y="265" class="b">Boundaries: period · semicolon · newline</text><text x="534" y="290" class="b">Operators: include/exclude · before/after</text><text x="534" y="315" class="b">with/without · explicit inflections</text><text x="534" y="340" class="s">Zero or multiple operators → diagnostic, no invented test.</text>
  <path d="M917 279H952" class="line"/>
  <rect x="954" y="204" width="376" height="150" rx="12" class="det"/>
  <text x="976" y="235" class="k">PROOF ENVELOPE</text><text x="976" y="263" class="mono">evidence 0:36</text><text x="976" y="286" class="mono">mutation 23:32</text><text x="976" y="309" class="mono">excluding → including</text><text x="976" y="332" class="mono">source_sha256 + stable_id</text>

  <text x="80" y="412" class="h">2 · FOUR REPLAYABLE CASES PER CLAIM</text>
  <rect x="70" y="434" width="300" height="190" rx="12" class="det"/>
  <text x="92" y="465" class="k">ORIGINAL</text><text x="92" y="496" class="mono">excluding tax</text><text x="92" y="531" class="b">Expected:</text><text x="92" y="556" class="mono">SUPPORTED</text><text x="92" y="595" class="s">Exact evidence witness retained.</text>
  <rect x="390" y="434" width="300" height="190" rx="12" class="det"/>
  <text x="412" y="465" class="k">FLIP</text><text x="412" y="496" class="mono">including tax</text><text x="412" y="531" class="b">Expected:</text><text x="412" y="556" class="mono">CONTRADICTED</text><text x="412" y="595" class="s">Only registered opposite inserted.</text>
  <rect x="710" y="434" width="300" height="190" rx="12" class="det"/>
  <text x="732" y="465" class="k">REMOVE</text><text x="732" y="496" class="mono">[claim deleted]</text><text x="732" y="531" class="b">Expected:</text><text x="732" y="556" class="mono">NOT_STATED</text><text x="732" y="595" class="s">Neither witness may remain.</text>
  <rect x="1030" y="434" width="300" height="190" rx="12" class="det"/>
  <text x="1052" y="465" class="k">PAD</text><text x="1052" y="496" class="mono">original + neutral text</text><text x="1052" y="531" class="b">Expected:</text><text x="1052" y="556" class="mono">SUPPORTED</text><text x="1052" y="595" class="s">Server-owned; one to three repeats.</text>

  <text x="80" y="684" class="h">3 · MODEL UNDER TEST AND STRICT PARSING</text>
  <rect x="70" y="706" width="390" height="186" rx="12" class="prob"/>
  <text x="92" y="737" class="k">OPTIONAL REAL MODEL</text><text x="92" y="766" class="b">Receives one metadata variant + original claim</text><text x="92" y="792" class="b">Temperature 0; OpenAI-compatible adapter</text><text x="92" y="818" class="b">Asked for exactly one fixed label</text><text x="92" y="853" class="s">Provider failure in auto mode → visible fallback.</text><text x="92" y="874" class="s">Explicit LLM mode fails with HTTP 503.</text>
  <rect x="505" y="706" width="390" height="186" rx="12" class="det"/>
  <text x="527" y="737" class="k">DETERMINISTIC SIMULATOR</text><text x="527" y="766" class="b">Searches the actual variant for exact claim</text><text x="527" y="792" class="b">or controlled-opposite witnesses</text><text x="527" y="818" class="b">Never reads expected_label</text><text x="527" y="853" class="s">Makes the harness runnable without a key.</text><text x="527" y="874" class="s">Its output is not presented as model evidence.</text>
  <path d="M895 799H938" class="line"/>
  <rect x="940" y="706" width="390" height="186" rx="12" class="det"/>
  <text x="962" y="737" class="k">STRICT LABEL PARSER</text><text x="962" y="766" class="mono">SUPPORTED</text><text x="962" y="790" class="mono">CONTRADICTED</text><text x="962" y="814" class="mono">NOT_STATED</text><text x="962" y="842" class="b">Anything else → INVALID → fail</text><text x="962" y="874" class="s">No substring markers. No semantic judge.</text>

  <text x="80" y="952" class="h">4 · VERDICT INVARIANTS AND SCORES</text>
  <rect x="70" y="974" width="600" height="244" rx="12" class="det"/>
  <text x="92" y="1005" class="k">PROOF VALIDATION BEFORE EXECUTION</text><text x="92" y="1035" class="b">• Source slice equals exact evidence text</text><text x="92" y="1062" class="b">• Mutation span is inside evidence and replays exactly</text><text x="92" y="1089" class="b">• IDs are deterministic and unique; evidence does not overlap</text><text x="92" y="1116" class="b">• Flip contains only opposite; remove contains neither witness</text><text x="92" y="1143" class="b">• Every proof has exactly four variants in stable order</text><text x="92" y="1182" class="s">A malformed proof raises before any provider call.</text>
  <rect x="700" y="974" width="630" height="244" rx="12" class="warn"/>
  <text x="722" y="1005" class="k">SCORING AND EPISTEMIC BOUNDARY</text><text x="722" y="1035" class="b">total_score = passing cases / all executed cases</text><text x="722" y="1062" class="b">model_only_score excludes every provider fallback</text><text x="722" y="1089" class="b">No compiled claims → null score + deterministic diagnostics</text><text x="722" y="1122" class="b">This tests grounding, sensitivity, abstention discipline,</text><text x="722" y="1148" class="b">and noise robustness. It does not test factual truth.</text><text x="722" y="1182" class="s">Future multi-model runs reuse these same proofs; one model never grades another.</text>
  <text x="70" y="1260" class="s">Verified by selfcheck.py and apicheck.py · stateless endpoint leaves probe_results and repairs unchanged</text>
</svg>
