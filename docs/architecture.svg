<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1300" width="1400" height="1300" role="img" aria-labelledby="title desc">
  <title id="title">Contextprobe current system architecture</title>
  <desc id="desc">Two separate paths: a stateless proof-carrying mutation playground and a legacy SQLite risk and repair demonstration, followed by clearly marked future priorities.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e8e3d8" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9Z" fill="#26352f"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#203129}.title{font-size:34px;font-weight:800}.sub{font-size:16px;fill:#63736b}.h{font-size:20px;font-weight:800}.k{font-size:13px;font-weight:800;letter-spacing:1.2px}.b{font-size:14px}.s{font-size:12px;fill:#63736b}.mono{font-family:Consolas,monospace;font-size:12px}.card{fill:#fff;stroke:#ced9d2;stroke-width:2}.det{fill:#eef7f1;stroke:#2e6b4f;stroke-width:2}.prob{fill:#fff1ef;stroke:#b64a3d;stroke-width:2}.legacy{fill:#fff9e7;stroke:#b99424;stroke-width:2}.future{fill:#f1f5fa;stroke:#35658a;stroke-width:2;stroke-dasharray:8 6}.line{fill:none;stroke:#26352f;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="1300" fill="#fcfaf4"/><rect width="1400" height="1300" fill="url(#grid)"/>
  <rect x="70" y="38" width="1260" height="100" rx="14" class="card"/>
  <text id="title" x="105" y="82" class="title">CONTEXTPROBE — CURRENT ARCHITECTURE</text>
  <text x="105" y="113" class="sub">Automatic proof-carrying grounding tests beside a separate legacy risk-and-repair fixture</text>
  <rect x="1010" y="66" width="18" height="18" class="det"/><text x="1038" y="80" class="s">deterministic verdict</text>
  <rect x="1010" y="94" width="18" height="18" class="prob"/><text x="1038" y="108" class="s">model under test</text>

  <rect x="160" y="172" width="1080" height="90" rx="12" class="card"/>
  <text x="190" y="205" class="k">REACT BROWSER</text><text x="190" y="234" class="b">Metadata-only form · compiled proofs · four variants · expected/observed labels · diagnostics · scores</text>
  <path d="M700 262V298" class="line"/>
  <rect x="160" y="300" width="1080" height="90" rx="12" class="card"/>
  <text x="190" y="333" class="k">FASTAPI</text><text x="190" y="362" class="b">POST /api/playground is stateless; catalogue, risk, and repair endpoints retain the legacy fixture</text>

  <text x="90" y="444" class="h">A · AUTOMATIC MUTATION PATH — BUILT</text>
  <text x="730" y="444" class="h">B · LEGACY FIXTURE PATH — RETAINED</text>
  <rect x="70" y="466" width="620" height="548" rx="16" fill="#f8fcf9" stroke="#2e6b4f" stroke-width="2.5"/>
  <rect x="710" y="466" width="620" height="548" rx="16" fill="#fffcf2" stroke="#b99424" stroke-width="2.5"/>

  <rect x="105" y="500" width="550" height="76" rx="10" class="det"/>
  <text x="125" y="529" class="k">1 · PROOF COMPILER</text><text x="125" y="554" class="b">Exact clause + evidence span + operator span + source SHA-256 + stable ID</text>
  <path d="M380 576V604" class="line"/>
  <rect x="105" y="606" width="550" height="86" rx="10" class="det"/>
  <text x="125" y="635" class="k">2 · SERVER-OWNED MUTATIONS</text>
  <text x="125" y="660" class="b">original · controlled flip · remove · bounded neutral padding</text><text x="125" y="680" class="s">Expected labels come from transform replay, not a human or model judge.</text>
  <path d="M380 692V720" class="line"/>
  <rect x="105" y="722" width="258" height="100" rx="10" class="prob"/>
  <text x="125" y="751" class="k">3A · REAL MODEL</text><text x="125" y="776" class="b">Optional provider</text><text x="125" y="799" class="s">Must emit one fixed label</text>
  <rect x="397" y="722" width="258" height="100" rx="10" class="det"/>
  <text x="417" y="751" class="k">3B · SIMULATOR</text><text x="417" y="776" class="b">Lexical witness check</text><text x="417" y="799" class="s">Reproducibility, not AI evidence</text>
  <path d="M380 822V850" class="line"/>
  <rect x="105" y="852" width="550" height="124" rx="10" class="det"/>
  <text x="125" y="881" class="k">4 · STRICT VERDICT AND SCORING</text>
  <text x="125" y="906" class="b">SUPPORTED · CONTRADICTED · NOT_STATED · otherwise INVALID</text>
  <text x="125" y="931" class="b">Exact comparison; fallback cases labelled and excluded from model-only score</text>
  <text x="125" y="956" class="s">No SQLite reads or writes. Tests grounding and sensitivity—not factual truth.</text>

  <rect x="745" y="500" width="550" height="76" rx="10" class="legacy"/>
  <text x="765" y="529" class="k">1 · SEEDED SQLITE CATALOGUE</text><text x="765" y="554" class="b">12 assets · lineage · 18 manually authored known-answer probes</text>
  <path d="M1020 576V604" class="line"/>
  <rect x="745" y="606" width="550" height="86" rx="10" class="legacy"/>
  <text x="765" y="635" class="k">2 · RUNNER + ANSWERER</text><text x="765" y="660" class="b">Description-only context → simulated or real-model answer</text><text x="765" y="680" class="s">The simulator’s hypothesis was falsified by the recorded model study.</text>
  <path d="M1020 692V720" class="line"/>
  <rect x="745" y="722" width="550" height="100" rx="10" class="legacy"/>
  <text x="765" y="751" class="k">3 · LEGACY MARKER GRADER + RISK</text>
  <text x="765" y="776" class="b">correct · abstained · confident_wrong</text><text x="765" y="799" class="s">Risk uses wrong-rate × downstream blast radius × certification.</text>
  <path d="M1020 822V850" class="line"/>
  <rect x="745" y="852" width="550" height="124" rx="10" class="legacy"/>
  <text x="765" y="881" class="k">4 · DRY-RUN REPAIR GATE</text>
  <text x="765" y="906" class="b">Ground from upstream/siblings → compose → re-probe → always restore</text>
  <text x="765" y="931" class="b">Accept only fixed &gt; 0 and regressed = 0; human approval remains required</text>
  <text x="765" y="956" class="s">Historical demonstration: answerability, not truth. Results persist only outside dry runs.</text>

  <text x="90" y="1068" class="h">NEXT PRIORITIES — NOT YET BUILT</text>
  <rect x="70" y="1090" width="396" height="146" rx="12" class="future"/>
  <text x="92" y="1121" class="k">P0 · CONTEXT SOURCE ADAPTERS</text><text x="92" y="1148" class="b">Compile provenance-backed claims from</text><text x="92" y="1170" class="b">types, glossary, constraints, lineage,</text><text x="92" y="1192" class="b">dbt artifacts, and historical traces.</text><text x="92" y="1218" class="s">Broader context, same proof boundary.</text>
  <rect x="502" y="1090" width="396" height="146" rx="12" class="future"/>
  <text x="524" y="1121" class="k">P0 · MULTI-MODEL MATRIX</text><text x="524" y="1148" class="b">Run the identical compiled cases across</text><text x="524" y="1170" class="b">multiple configured providers; preserve</text><text x="524" y="1192" class="b">per-model failures and fallback counts.</text><text x="524" y="1218" class="s">No cross-model judge.</text>
  <rect x="934" y="1090" width="396" height="146" rx="12" class="future"/>
  <text x="956" y="1121" class="k">P1 · REGRESSION BASELINES</text><text x="956" y="1148" class="b">Version source hash, compiler version,</text><text x="956" y="1170" class="b">model, and observed labels; diff them</text><text x="956" y="1192" class="b">on metadata changes in CI.</text><text x="956" y="1218" class="s">Then add task traces and SQL sandboxes.</text>
</svg>
