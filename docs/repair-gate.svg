<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1300" width="1400" height="1300" role="img" aria-labelledby="title desc">
  <title id="title">Contextprobe repair and regression boundaries</title>
  <desc id="desc">The current legacy dry-run repair gate, the separate automatic mutation compiler, and the future regression gate that could connect them without automatic commits.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e8e3d8"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9Z" fill="#26352f"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#203129}.title{font-size:34px;font-weight:800}.sub{font-size:16px;fill:#63736b}.h{font-size:20px;font-weight:800}.k{font-size:13px;font-weight:800;letter-spacing:1px}.b{font-size:14px}.s{font-size:12px;fill:#63736b}.mono{font-family:Consolas,monospace;font-size:13px}.card{fill:#fff;stroke:#ced9d2;stroke-width:2}.good{fill:#eef7f1;stroke:#2e6b4f;stroke-width:2}.bad{fill:#fff1ef;stroke:#b64a3d;stroke-width:2}.warn{fill:#fff9e7;stroke:#b99424;stroke-width:2}.future{fill:#f1f5fa;stroke:#35658a;stroke-width:2;stroke-dasharray:8 6}.line{fill:none;stroke:#26352f;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="1300" fill="#fcfaf4"/><rect width="1400" height="1300" fill="url(#grid)"/>
  <rect x="70" y="38" width="1260" height="100" rx="14" class="card"/>
  <text x="105" y="82" class="title">REPAIR GATE AND REGRESSION BOUNDARIES</text>
  <text x="105" y="113" class="sub">What is built today, what the mutation compiler does not do, and the safest next integration</text>

  <rect x="70" y="170" width="1260" height="92" rx="12" class="warn"/>
  <text x="94" y="202" class="k">IMPORTANT SEPARATION</text><text x="94" y="229" class="b">The automatic mutation playground tests grounding and never edits metadata. The repair gate below is the legacy 18-probe fixture path.</text><text x="94" y="250" class="s">Neither path establishes factual truth, and neither path automatically commits a rewrite.</text>

  <text x="80" y="318" class="h">A · CURRENT DRY-RUN REPAIR GATE — BUILT</text>
  <rect x="70" y="340" width="190" height="126" rx="12" class="card"/>
  <text x="91" y="371" class="k">1 · BASELINE</text><text x="91" y="401" class="b">Run all probes</text><text x="91" y="425" class="b">for the asset</text><text x="91" y="451" class="s">persist = false</text>
  <path d="M260 403H284" class="line"/>
  <rect x="286" y="340" width="190" height="126" rx="12" class="card"/>
  <text x="307" y="371" class="k">2 · GROUND</text><text x="307" y="401" class="b">Read upstream,</text><text x="307" y="425" class="b">sibling, asset text</text><text x="307" y="451" class="s">No probe terms</text>
  <path d="M476 403H500" class="line"/>
  <rect x="502" y="340" width="190" height="126" rx="12" class="card"/>
  <text x="523" y="371" class="k">3 · COMPOSE</text><text x="523" y="401" class="b">grounded, verbose,</text><text x="523" y="425" class="b">or narrow candidate</text><text x="523" y="451" class="s">Fixture strategies</text>
  <path d="M692 403H716" class="line"/>
  <rect x="718" y="340" width="190" height="126" rx="12" class="warn"/>
  <text x="739" y="371" class="k">4 · APPLY</text><text x="739" y="401" class="b">Temporarily write</text><text x="739" y="425" class="b">the candidate</text><text x="739" y="451" class="s">Single-user fixture</text>
  <path d="M908 403H932" class="line"/>
  <rect x="934" y="340" width="190" height="126" rx="12" class="card"/>
  <text x="955" y="371" class="k">5 · RE-PROBE</text><text x="955" y="401" class="b">Compare every</text><text x="955" y="425" class="b">before/after outcome</text><text x="955" y="451" class="s">persist = false</text>
  <path d="M1124 403H1148" class="line"/>
  <rect x="1150" y="340" width="180" height="126" rx="12" class="good"/>
  <text x="1171" y="371" class="k">6 · RESTORE</text><text x="1171" y="401" class="b">Always in finally</text><text x="1171" y="425" class="b">even on failure</text><text x="1171" y="451" class="s">Asserted by tests</text>

  <rect x="70" y="500" width="605" height="156" rx="12" class="good"/>
  <text x="94" y="532" class="k">CURRENT VERDICT</text><text x="94" y="568" class="mono">ACCEPT ⇔ fixed &gt; 0 AND regressed = 0</text><text x="94" y="602" class="b">Measured fixture sweep: 1 accepted of 3 attempted</text><text x="94" y="630" class="s">Accepted means answerability improved—not that wording is true.</text>
  <rect x="695" y="500" width="635" height="156" rx="12" class="bad"/>
  <text x="719" y="532" class="k">KNOWN COUNTEREXAMPLE</text><text x="719" y="564" class="b">The accepted net_revenue rewrite inherits “before refunds”</text><text x="719" y="590" class="b">from gross_revenue. That polarity is false for net revenue,</text><text x="719" y="616" class="b">but the legacy marker grader cannot detect it.</text><text x="719" y="640" class="s">Therefore the result is a steward recommendation, never an automatic commit.</text>

  <text x="80" y="718" class="h">B · AUTOMATIC MUTATION PLAYGROUND — BUILT, SEPARATE</text>
  <rect x="70" y="740" width="1260" height="142" rx="12" class="good"/>
  <text x="94" y="772" class="k">WHAT IT ADDS NOW</text><text x="94" y="802" class="b">Exact source spans, controlled polarity flips, removal, padding, fixed labels, strict comparison, and fallback-safe scoring.</text><text x="94" y="830" class="b">It removes human-authored questions for supported claims and catches whether a model tracks a controlled opposite.</text><text x="94" y="858" class="s">It does not propose a rewrite, consult external truth, calculate blast radius, persist results, or replace the legacy repair gate.</text>

  <text x="80" y="944" class="h">C · SAFE NEXT INTEGRATION — NOT YET BUILT</text>
  <rect x="70" y="966" width="245" height="174" rx="12" class="future"/>
  <text x="92" y="998" class="k">1 · VERSION INPUT</text><text x="92" y="1028" class="b">Source hash, compiler,</text><text x="92" y="1052" class="b">context-source IDs,</text><text x="92" y="1076" class="b">model and prompt</text><text x="92" y="1112" class="s">Reproducible baseline</text>
  <path d="M315 1053H339" class="line"/>
  <rect x="341" y="966" width="245" height="174" rx="12" class="future"/>
  <text x="363" y="998" class="k">2 · RUN MATRIX</text><text x="363" y="1028" class="b">Same proof cases</text><text x="363" y="1052" class="b">across configured</text><text x="363" y="1076" class="b">models and contexts</text><text x="363" y="1112" class="s">No model judges another</text>
  <path d="M586 1053H610" class="line"/>
  <rect x="612" y="966" width="245" height="174" rx="12" class="future"/>
  <text x="634" y="998" class="k">3 · DIFF LABELS</text><text x="634" y="1028" class="b">Detect changed pass,</text><text x="634" y="1052" class="b">abstention, fallback,</text><text x="634" y="1076" class="b">and invalid rates</text><text x="634" y="1112" class="s">Block regressions in CI</text>
  <path d="M857 1053H881" class="line"/>
  <rect x="883" y="966" width="245" height="174" rx="12" class="future"/>
  <text x="905" y="998" class="k">4 · VERIFY TRUTH</text><text x="905" y="1028" class="b">Use SQL, dbt tests,</text><text x="905" y="1052" class="b">constraints, glossary,</text><text x="905" y="1076" class="b">or human evidence</text><text x="905" y="1112" class="s">Separate from grounding</text>
  <path d="M1128 1053H1152" class="line"/>
  <rect x="1154" y="966" width="176" height="174" rx="12" class="future"/>
  <text x="1176" y="998" class="k">5 · APPROVE</text><text x="1176" y="1028" class="b">Show evidence</text><text x="1176" y="1052" class="b">and diffs to</text><text x="1176" y="1076" class="b">a steward</text><text x="1176" y="1112" class="s">Never auto-commit</text>

  <rect x="70" y="1180" width="1260" height="74" rx="12" class="warn"/>
  <text x="94" y="1210" class="k">PRIORITY RULE</text><text x="94" y="1238" class="b">Add provenance-backed context and multi-model regression before agentic repair; otherwise automation only scales an unverified rewrite.</text>
</svg>
